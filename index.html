<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FONA Mathematics Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ═══ FONA Mathematics Intelligence — Design System ═══
   Layout : Full-screen SPA, sticky top nav, card grid content
   Palette: FONA navy/gold, dark-first with light override      */

:root {
  --navy:    #09182A;
  --navy2:   #112236;
  --navy3:   #192F4A;
  --navy4:   #1E3A5A;
  --gold:    #F5A623;
  --gold2:   #FFD07B;
  --gold-bg: rgba(245,166,35,.13);
  --blue:    #4D9FFF;
  --green:   #2ECC8A;
  --red:     #FF6B6B;
  --purple:  #A78BFA;
  --orange:  #FF8C42;

  --bg:      var(--navy);
  --s1:      var(--navy2);
  --s2:      var(--navy3);
  --s3:      var(--navy4);
  --border:  rgba(77,159,255,.15);
  --fg:      #E8F4FF;
  --fg2:     #8AAEC8;
  --fg3:     #4A6A84;
  --accent:  var(--gold);

  --fh: 'Nunito', system-ui, sans-serif;
  --fb: 'Space Grotesk', system-ui, sans-serif;
  --r: 14px; --rl: 22px;
  --shadow: 0 4px 24px rgba(0,0,0,.45);
  color-scheme: dark;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --bg:#EEF3FF;--s1:#fff;--s2:#F0F6FF;--s3:#E2ECFF;
    --border:rgba(13,27,42,.1);--fg:#0D1B2A;--fg2:#3A5470;--fg3:#7A94A8;
    --gold-bg:rgba(245,166,35,.1); color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#EEF3FF;--s1:#fff;--s2:#F0F6FF;--s3:#E2ECFF;
  --border:rgba(13,27,42,.1);--fg:#0D1B2A;--fg2:#3A5470;--fg3:#7A94A8;
  --gold-bg:rgba(245,166,35,.1); color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--fb);background:var(--bg);color:var(--fg);min-height:100dvh;overflow-x:hidden}
h1,h2,h3,h4{font-family:var(--fh);font-weight:800}
button{cursor:pointer;border:none;font-family:var(--fb);font-size:1rem}
input{font-family:var(--fb);font-size:1rem}
img{max-width:100%}

/* ─── LAYOUT ─── */
#app{display:flex;flex-direction:column;min-height:100dvh}
.page{flex:1;padding:20px 20px 90px;max-width:900px;margin:0 auto;width:100%}
.page.wide{max-width:1100px}

/* ─── TOPBAR ─── */
.topbar{position:sticky;top:env(safe-area-inset-top,0);background:var(--s1);
  border-bottom:1px solid var(--border);backdrop-filter:blur(12px);
  padding:10px 18px;display:flex;align-items:center;gap:10px;z-index:100;
  box-shadow:0 2px 16px rgba(0,0,0,.18)}
.topbar-logo{font-family:var(--fh);font-weight:900;font-size:1.05rem;color:var(--gold);white-space:nowrap;letter-spacing:.02em}
.topbar-logo span{color:var(--fg);font-weight:700}
.topbar-user{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--fg2)}
.topbar-name{font-weight:600;color:var(--fg)}
.topbar-avatar{font-size:1.3rem;line-height:1}
.topbar-avatar-img{width:30px;height:30px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);flex-shrink:0;box-shadow:0 0 0 3px rgba(245,166,35,.15)}
.topbar-back{background:rgba(77,159,255,.08);color:var(--fg2);font-size:.82rem;
  padding:5px 12px;border:1px solid var(--border);border-radius:20px;
  display:flex;align-items:center;gap:4px;font-weight:600;transition:all .18s;letter-spacing:.01em}
.topbar-back:hover{background:var(--s2);color:var(--fg);border-color:var(--gold)}
.topbar-exit{background:rgba(255,107,107,.08);color:var(--red);font-size:.78rem;
  padding:4px 10px;border:1px solid rgba(255,107,107,.2);border-radius:20px;font-weight:700;
  transition:all .18s;letter-spacing:.02em}
.topbar-exit:hover{background:rgba(255,107,107,.18)}

/* ─── BOTTOM NAV ─── */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--s1);
  border-top:1px solid var(--border);display:flex;z-index:100;
  padding-bottom:env(safe-area-inset-bottom,0);
  box-shadow:0 -4px 24px rgba(0,0,0,.22);backdrop-filter:blur(12px)}
.bnav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:10px 4px 8px;background:none;color:var(--fg3);font-size:.62rem;font-weight:700;
  text-transform:uppercase;letter-spacing:.05em;border-top:2px solid transparent;transition:all .2s}
.bnav-btn .bicon{font-size:1.35rem;line-height:1;transition:transform .2s}
.bnav-btn .blabel{line-height:1}
.bnav-btn.active{color:var(--gold);border-top-color:var(--gold)}
.bnav-btn.active .bicon{transform:scale(1.15)}
.bnav-btn:hover{color:var(--fg)}

/* ─── CARDS ─── */
.card{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);padding:18px;transition:all .22s}
.card.interactive{cursor:pointer}
.card.interactive:hover{border-color:rgba(245,166,35,.5);transform:translateY(-3px);
  box-shadow:0 10px 32px rgba(0,0,0,.38),0 0 0 1px rgba(245,166,35,.12)}
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:600px){.grid-3,.grid-4{grid-template-columns:repeat(2,1fr)}.grid-2{grid-template-columns:1fr}}

/* ─── BUTTONS ─── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 22px;
  border-radius:var(--r);font-weight:700;font-size:.95rem;transition:all .18s}
.btn-gold{background:var(--gold);color:#0D1B2A}
.btn-gold:hover{background:var(--gold2);transform:translateY(-1px)}
.btn-outline{background:transparent;border:2px solid var(--border);color:var(--fg)}
.btn-outline:hover{border-color:var(--gold);color:var(--gold)}
.btn-green{background:var(--green);color:#fff}
.btn-green:hover{opacity:.9}
.btn-red{background:var(--red);color:#fff}
.btn-block{width:100%;margin-top:10px}
.btn-sm{padding:8px 14px;font-size:.82rem}
.btn-lg{padding:16px 32px;font-size:1.1rem;border-radius:18px}

/* ─── BADGES / PILLS ─── */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;
  font-size:.75rem;font-weight:700;letter-spacing:.02em}
.badge-gold{background:var(--gold-bg);color:var(--gold)}
.badge-green{background:rgba(46,204,138,.15);color:var(--green)}
.badge-blue{background:rgba(77,159,255,.15);color:var(--blue)}
.badge-purple{background:rgba(167,139,250,.15);color:var(--purple)}
.badge-red{background:rgba(255,107,107,.15);color:var(--red)}

/* ─── PROGRESS ─── */
.progress-bar{background:var(--s2);border-radius:20px;height:8px;overflow:hidden}
.progress-fill{height:100%;border-radius:20px;background:var(--gold);transition:width .5s ease}
.progress-fill.green{background:var(--green)}
.progress-fill.blue{background:var(--blue)}

/* ─── STAT TILES ─── */
.stat-tile{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);
  padding:18px 12px;text-align:center;transition:transform .2s}
.stat-tile:hover{transform:translateY(-2px)}
.stat-tile .num{font-family:var(--fh);font-size:2.1rem;font-weight:900;line-height:1.1}
.stat-tile .lbl{font-size:.68rem;color:var(--fg2);margin-top:5px;text-transform:uppercase;letter-spacing:.06em;font-weight:700}

/* ─── LOGIN — COMMAND CENTRE ─── */
@keyframes scanline{0%{transform:translateY(-100%)}100%{transform:translateY(100vh)}}
@keyframes pulse-ring{0%,100%{opacity:.4;transform:scale(1)}50%{opacity:.9;transform:scale(1.04)}}
@keyframes float-in{0%{opacity:0;transform:translateY(22px)}100%{opacity:1;transform:translateY(0)}}
@keyframes hud-blink{0%,90%,100%{opacity:1}95%{opacity:.3}}
@keyframes border-glow{0%,100%{box-shadow:0 0 12px rgba(212,175,55,.25),0 0 0 1px rgba(212,175,55,.2)}
  50%{box-shadow:0 0 28px rgba(212,175,55,.55),0 0 0 1px rgba(212,175,55,.5)}}

.login-page{
  min-height:100dvh;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:20px;position:relative;overflow:hidden;
  background:radial-gradient(ellipse at 50% 0%,#0d1a35 0%,#060b18 60%,#020408 100%);
}
/* animated grid floor */
.login-page::before{
  content:'';position:absolute;inset:0;
  background-image:
    linear-gradient(rgba(212,175,55,.07) 1px,transparent 1px),
    linear-gradient(90deg,rgba(212,175,55,.07) 1px,transparent 1px);
  background-size:40px 40px;
  mask-image:radial-gradient(ellipse at 50% 60%,black 30%,transparent 75%);
  pointer-events:none;
}
/* scan line sweep */
.login-page::after{
  content:'';position:absolute;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,rgba(212,175,55,.4),transparent);
  animation:scanline 5s linear infinite;pointer-events:none;
}

/* ── logo block ── */
.login-logo{
  display:flex;align-items:center;gap:14px;margin-bottom:6px;
  animation:float-in .6s ease both;
}
.login-logo-emblem{
  width:56px;height:56px;border-radius:14px;
  background:linear-gradient(135deg,#d4af37 0%,#f5c842 50%,#b8860b 100%);
  display:flex;align-items:center;justify-content:center;
  font-size:1.7rem;font-weight:900;color:#060b18;
  box-shadow:0 0 32px rgba(212,175,55,.5),0 4px 16px rgba(0,0,0,.6);
  font-family:var(--fh);letter-spacing:-.02em;flex-shrink:0;
}
.login-logo-text{text-align:left}
.login-logo-text .brand{
  font-family:var(--fh);font-size:1.55rem;font-weight:900;letter-spacing:.06em;
  background:linear-gradient(90deg,#f5c842,#d4af37,#ffe680);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  line-height:1;
}
.login-logo-text .product{
  font-size:.72rem;letter-spacing:.18em;color:rgba(212,175,55,.65);
  text-transform:uppercase;margin-top:2px;font-weight:600;
}

/* ── hero text ── */
.login-hero{
  text-align:center;margin-bottom:28px;
  animation:float-in .7s .1s ease both;
}
.login-hero h1{
  font-family:var(--fh);font-size:clamp(1.5rem,4vw,2rem);font-weight:900;
  color:#fff;letter-spacing:-.01em;line-height:1.15;margin-bottom:8px;
}
.login-hero h1 em{
  font-style:normal;
  background:linear-gradient(90deg,#f5c842,#d4af37);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.login-hero .hud-status{
  display:inline-flex;align-items:center;gap:7px;
  font-size:.75rem;letter-spacing:.12em;color:rgba(212,175,55,.7);text-transform:uppercase;
  background:rgba(212,175,55,.06);border:1px solid rgba(212,175,55,.18);
  border-radius:100px;padding:5px 14px;
}
.hud-dot{width:7px;height:7px;border-radius:50%;background:#2ECC8A;animation:hud-blink 3s infinite;flex-shrink:0}

/* ── profile grid ── */
.profile-grid{
  display:grid;grid-template-columns:repeat(2,1fr);gap:14px;
  width:100%;max-width:500px;
  animation:float-in .8s .2s ease both;
}

/* ── profile card ── */
.profile-card{
  position:relative;border-radius:18px;cursor:pointer;
  background:linear-gradient(145deg,rgba(13,26,53,.95),rgba(6,11,24,.98));
  border:1px solid rgba(212,175,55,.2);
  padding:20px 14px 16px;text-align:center;
  transition:transform .25s,border-color .25s,box-shadow .25s;
  -webkit-tap-highlight-color:transparent;overflow:hidden;
}
.profile-card::before{
  content:'';position:absolute;inset:0;border-radius:18px;
  background:linear-gradient(145deg,rgba(212,175,55,.06),transparent 60%);
  pointer-events:none;
}
/* corner accent */
.profile-card::after{
  content:'';position:absolute;top:0;left:0;width:28px;height:28px;
  border-top:2px solid rgba(212,175,55,.4);border-left:2px solid rgba(212,175,55,.4);
  border-radius:18px 0 0 0;pointer-events:none;
}
.profile-card:hover{transform:translateY(-3px);border-color:rgba(212,175,55,.5);
  box-shadow:0 12px 40px rgba(0,0,0,.5),0 0 20px rgba(212,175,55,.15)}
.profile-card.active{
  border-color:rgba(212,175,55,.75);transform:none;
  animation:border-glow 2.5s ease-in-out infinite;
  background:linear-gradient(145deg,rgba(13,26,53,.98),rgba(6,11,24,1));
}

/* ── avatar ── */
.profile-card .avatar{
  width:72px;height:72px;border-radius:50%;margin:0 auto 10px;
  overflow:hidden;position:relative;flex-shrink:0;
  border:2px solid rgba(212,175,55,.3);
  box-shadow:0 0 18px rgba(212,175,55,.2),0 4px 16px rgba(0,0,0,.5);
}
.profile-card .avatar img{width:100%;height:100%;object-fit:cover;display:block}
.profile-card .avatar-emoji{
  width:72px;height:72px;border-radius:50%;margin:0 auto 10px;
  display:flex;align-items:center;justify-content:center;font-size:2.6rem;
  background:rgba(212,175,55,.08);border:2px solid rgba(212,175,55,.2);
}
.profile-card .pname{
  font-family:var(--fh);font-weight:800;font-size:.95rem;color:#fff;
  letter-spacing:.01em;line-height:1.2;
}
.profile-card .pyear{
  font-size:.72rem;color:rgba(212,175,55,.7);margin-top:4px;
  letter-spacing:.08em;text-transform:uppercase;font-weight:600;
}
.profile-card .access-badge{
  display:inline-block;margin-top:6px;font-size:.65rem;letter-spacing:.06em;
  background:rgba(212,175,55,.1);border:1px solid rgba(212,175,55,.25);
  border-radius:100px;padding:2px 10px;color:rgba(212,175,55,.8);
}

/* ── inline code entry ── */
.card-code-box{display:none;margin-top:14px;padding-top:12px;border-top:1px solid rgba(212,175,55,.15)}
.profile-card.active .card-code-box{display:block}
.card-code-box input{
  width:100%;padding:11px 8px;box-sizing:border-box;
  border:1px solid rgba(212,175,55,.3);border-radius:10px;
  background:rgba(0,0,0,.5);color:#f5c842;
  text-align:center;font-size:1.05rem;letter-spacing:.35em;
  text-transform:uppercase;font-family:var(--fh);font-weight:700;
}
.card-code-box input::placeholder{color:rgba(212,175,55,.3);letter-spacing:.1em}
.card-code-box input:focus{outline:none;border-color:rgba(212,175,55,.8);
  box-shadow:0 0 0 3px rgba(212,175,55,.12);background:rgba(0,0,0,.6)}
.btn-signin{
  margin-top:9px;width:100%;padding:11px;
  background:linear-gradient(135deg,#d4af37,#f5c842);
  color:#060b18;font-weight:900;border:none;border-radius:10px;
  cursor:pointer;font-size:.88rem;font-family:var(--fh);letter-spacing:.05em;
  transition:opacity .15s,box-shadow .15s;
  box-shadow:0 4px 14px rgba(212,175,55,.35);
}
.btn-signin:active{opacity:.85}
.pin-error{color:#ff6b6b;font-size:.8rem;margin-top:7px;min-height:18px;text-align:center;font-weight:600}
.pin-box{display:none}

/* ─── DASHBOARD ─── */
.dash-greeting{margin-bottom:24px;padding-bottom:20px;border-bottom:1px solid var(--border)}
.dash-greeting h2{font-size:1.7rem;font-weight:900;line-height:1.2}
.dash-greeting p{color:var(--fg2);margin-top:6px;font-size:.95rem}
.streak-bar{background:linear-gradient(135deg,rgba(245,166,35,.12),rgba(245,166,35,.06));
  border:1px solid rgba(245,166,35,.35);border-radius:var(--r);
  padding:14px 18px;display:flex;align-items:center;gap:14px;margin-bottom:22px;
  box-shadow:0 2px 12px rgba(245,166,35,.08)}
.streak-bar .fire{font-size:1.8rem}
.streak-bar .stext{flex:1}
.streak-bar .snum{font-family:var(--fh);font-weight:900;font-size:1.6rem;color:var(--gold)}

/* ─── QUICK ACCESS CARDS ─── */
.dash-quick{border-top:3px solid var(--qc,var(--border));padding:20px 18px}
.dash-quick:hover{border-top-color:var(--qc,var(--gold))}
.dash-qicon{font-size:1.8rem;margin-bottom:10px;line-height:1}
.dash-qtitle{font-family:var(--fh);font-size:1rem;font-weight:800;margin-bottom:5px}
.dash-qsub{font-size:.8rem;color:var(--fg2)}

/* ─── TIMES TABLES HUB ─── */
.tt-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tt-cell{background:var(--s1);border:2px solid var(--border);border-radius:var(--r);
  padding:14px 8px;text-align:center;cursor:pointer;transition:all .22s;position:relative;overflow:hidden}
.tt-cell::before{content:'';position:absolute;inset:0;opacity:0;background:radial-gradient(circle at 50% 0%,rgba(245,166,35,.12),transparent 70%);transition:opacity .22s}
.tt-cell:hover{border-color:rgba(245,166,35,.6);transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.3)}
.tt-cell:hover::before{opacity:1}
.tt-cell .tn{font-family:var(--fh);font-size:1.6rem;font-weight:900;line-height:1}
.tt-cell .tp{font-size:.68rem;color:var(--fg2);margin-top:4px;line-height:1.3}
.tt-cell .stars{font-size:.85rem;margin-top:6px}
.tt-cell.mastered{border-color:rgba(46,204,138,.5);background:rgba(46,204,138,.04)}
.tt-cell.mastered .tn{color:var(--green)}
.tt-cell.learning{border-color:rgba(245,166,35,.45);background:rgba(245,166,35,.04)}
.tt-cell.learning .tn{color:var(--gold)}
@media(max-width:500px){.tt-grid{grid-template-columns:repeat(3,1fr)}}

/* ─── QUIZ / PRACTICE ─── */
.quiz-wrap{max-width:600px;margin:0 auto}
.quiz-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;
  padding:10px 14px;background:var(--s1);border-radius:var(--r);border:1px solid var(--border)}
.quiz-counter{font-size:.82rem;color:var(--fg2);font-weight:600}
.quiz-score-pill{background:var(--gold-bg);color:var(--gold);padding:4px 14px;border-radius:20px;
  font-weight:800;font-size:.83rem;letter-spacing:.02em}
.quiz-question{background:linear-gradient(145deg,var(--s1),var(--s2));border:1px solid var(--border);
  border-radius:var(--rl);padding:32px 24px;text-align:center;margin-bottom:18px;
  box-shadow:0 4px 20px rgba(0,0,0,.2)}
.quiz-question .qhook{font-size:.83rem;color:var(--fg2);margin-bottom:12px;font-style:italic;line-height:1.5}
.quiz-question .qtext{font-family:var(--fh);font-size:2rem;font-weight:900;line-height:1.2;color:var(--fg)}
.quiz-question .qsub{font-size:.88rem;color:var(--fg2);margin-top:8px}
.answer-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.ans-btn{background:var(--s2);border:2px solid var(--border);border-radius:var(--r);
  padding:18px 12px;font-size:1.1rem;font-weight:700;font-family:var(--fh);
  color:var(--fg);text-align:center;cursor:pointer;transition:all .18s}
.ans-btn:hover{border-color:var(--blue);background:var(--s3);transform:translateY(-1px)}
.ans-btn.correct{background:rgba(46,204,138,.18);border-color:var(--green);color:var(--green)}
.ans-btn.wrong{background:rgba(255,107,107,.13);border-color:var(--red);color:var(--red)}
.ans-btn.reveal{background:rgba(46,204,138,.1);border-color:var(--green)}
.ans-btn:disabled{pointer-events:none;opacity:.8}

/* ─── TT INPUT ─── */
.tt-input-box{display:flex;gap:12px;margin:22px 0;align-items:center;justify-content:center}
.tt-input{width:130px;padding:16px;border:2px solid var(--border);border-radius:var(--r);
  background:var(--s1);color:var(--fg);text-align:center;font-size:1.6rem;font-weight:800;
  font-family:var(--fh);transition:border-color .18s,box-shadow .18s}
.tt-input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(245,166,35,.15)}
.tt-input.correct{border-color:var(--green);background:rgba(46,204,138,.1);box-shadow:0 0 0 3px rgba(46,204,138,.12)}
.tt-input.wrong{border-color:var(--red);background:rgba(255,107,107,.08);box-shadow:0 0 0 3px rgba(255,107,107,.1)}

/* ─── LESSON ─── */
.lesson-hook{background:var(--gold-bg);border:1px solid rgba(245,166,35,.25);border-radius:var(--r);
  padding:16px 18px;margin-bottom:18px;font-size:.95rem;line-height:1.6}
.lesson-hook strong{color:var(--gold)}
.steps-list{list-style:none;display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
.steps-list li{display:flex;gap:12px;background:var(--s1);border:1px solid var(--border);
  border-radius:var(--r);padding:14px 16px;font-size:.92rem;line-height:1.5}
.step-num{background:var(--gold);color:#0D1B2A;border-radius:50%;width:26px;height:26px;
  display:flex;align-items:center;justify-content:center;font-weight:900;font-size:.85rem;
  flex-shrink:0;margin-top:1px}
.tip-box{background:rgba(77,159,255,.1);border:1px solid rgba(77,159,255,.2);border-radius:var(--r);
  padding:14px 16px;font-size:.88rem;color:var(--blue);line-height:1.5;margin-bottom:20px}

/* ─── SPEED TIMER ─── */
.timer-ring{text-align:center;margin-bottom:20px}
.timer-num{font-family:var(--fh);font-size:3rem;font-weight:900;color:var(--gold)}
.timer-lbl{font-size:.75rem;color:var(--fg2);text-transform:uppercase;letter-spacing:.08em}
.speed-score{font-family:var(--fh);font-size:2rem;font-weight:900;text-align:center;color:var(--green)}

/* ─── BATTLE ─── */
.battle-arena{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
.battle-player{background:var(--s1);border:2px solid var(--border);border-radius:var(--rl);
  padding:16px;text-align:center;transition:all .2s}
.battle-player.active{border-color:var(--gold);box-shadow:0 0 20px var(--gold-bg)}
.battle-player .bp-name{font-family:var(--fh);font-weight:900;font-size:1rem;margin-bottom:4px}
.battle-player .bp-score{font-size:2rem;font-weight:900;color:var(--gold)}
.battle-player .bp-av{font-size:2rem}
@media(max-width:480px){.battle-arena{grid-template-columns:1fr;gap:10px}.battle-player{padding:12px}}

/* ─── CHASE ─── */
.chase-banner{background:linear-gradient(135deg,#1A0A3A,#2D1B5A);border:1px solid rgba(167,139,250,.3);
  border-radius:var(--rl);padding:24px;text-align:center;margin-bottom:20px}
.chase-banner h2{color:var(--purple);font-size:1.8rem}
.chase-banner p{color:var(--fg2);margin-top:6px}
.chase-card{background:var(--s1);border:2px solid var(--border);border-radius:var(--r);
  padding:20px;cursor:pointer;transition:all .2s;display:flex;align-items:flex-start;gap:16px}
.chase-card:hover{border-color:var(--purple);transform:translateY(-2px)}
.chase-icon{font-size:2.2rem;flex-shrink:0}
.chase-card h3{font-family:var(--fh);font-size:1rem;margin-bottom:4px}
.chase-card p{font-size:.82rem;color:var(--fg2);line-height:1.5}

/* ─── PARENT DASH ─── */
.parent-child{background:var(--s1);border:1px solid var(--border);border-radius:var(--rl);
  padding:20px;margin-bottom:16px}
.parent-child-header{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.parent-child-header .av{font-size:2rem}
.parent-child-header h3{font-family:var(--fh);font-weight:900}
.parent-child-header p{font-size:.8rem;color:var(--fg2)}
.topic-progress{display:flex;flex-direction:column;gap:8px}
.tp-row{display:flex;align-items:center;gap:10px;font-size:.83rem}
.tp-row .label{width:140px;flex-shrink:0;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tp-row .bar{flex:1}
.tp-row .pct{width:32px;text-align:right;font-weight:700;color:var(--fg2)}

/* ─── RESULT ─── */
.result-box{text-align:center;padding:36px 24px;background:linear-gradient(145deg,var(--s1),var(--s2));
  border:1px solid var(--border);border-radius:var(--rl);box-shadow:0 6px 28px rgba(0,0,0,.25)}
.result-box .big-emoji{font-size:4rem;margin-bottom:12px}
.result-box h2{font-size:1.7rem;font-weight:900}
.result-box .sub{color:var(--fg2);margin-top:6px;line-height:1.5}
.result-score{font-family:var(--fh);font-size:3.2rem;font-weight:900;color:var(--gold);margin:14px 0;
  text-shadow:0 0 20px rgba(245,166,35,.3)}
.stars-row{font-size:2rem;margin:10px 0;letter-spacing:6px}

/* ─── ACHIEVEMENT TOAST ─── */
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);
  background:var(--s1);border:2px solid var(--gold);border-radius:var(--r);
  padding:12px 20px;display:flex;align-items:center;gap:10px;
  box-shadow:var(--shadow);z-index:200;min-width:280px;animation:slideUp .4s ease}
.toast .ti{font-size:1.5rem}
.toast .tt-title{font-weight:700;font-size:.9rem;color:var(--gold)}
.toast .tt-sub{font-size:.78rem;color:var(--fg2)}
@keyframes slideUp{from{opacity:0;transform:translateX(-50%) translateY(20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

/* ─── SETTINGS ─── */
.settings-group{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);
  padding:20px;margin-bottom:16px}
.settings-group h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.07em;color:var(--fg2);margin-bottom:14px}
.field-row{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.field-row label{width:100px;flex-shrink:0;font-size:.85rem;color:var(--fg2)}
.field-row input{flex:1;padding:9px 12px;background:var(--s2);border:1px solid var(--border);
  border-radius:8px;color:var(--fg);font-size:.9rem}
.field-row input:focus{outline:none;border-color:var(--gold)}
.save-indicator{color:var(--green);font-size:.82rem;margin-top:4px}

/* ─── MISC ─── */
.section-title{font-size:1rem;font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:8px;
  text-transform:uppercase;letter-spacing:.06em;color:var(--fg2)}
.section-title-lg{font-size:1.3rem;font-weight:900;margin-bottom:16px;font-family:var(--fh);color:var(--fg)}
.muted{color:var(--fg2);line-height:1.6}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}.mt24{margin-top:24px}
.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}
.flex{display:flex}.flex-center{display:flex;align-items:center}.gap8{gap:8px}.gap12{gap:12px}
.text-center{text-align:center}.fw700{font-weight:700}.fw900{font-weight:900}
.animate-pop{animation:pop .3s cubic-bezier(.17,.67,.34,1.3)}
@keyframes pop{0%{transform:scale(.8);opacity:0}100%{transform:scale(1);opacity:1}}
.correct-flash{animation:correctFlash .5s}
@keyframes correctFlash{0%{background:rgba(46,204,138,.3)}100%{background:transparent}}
.no-results{text-align:center;color:var(--fg2);padding:40px 20px}
</style>
</head>

  return false;
};

// ─── DATA / STORAGE (localStorage only — no external dependency) ──
let DATA={users:JSON.parse(JSON.stringify(DEFAULT_USERS)),progress:{},achievements:{}};
function localSave(){try{localStorage.setItem('fona_maths',JSON.stringify(DATA));}catch(e){}}

function initData(){
  try{
    const raw=localStorage.getItem('fona_maths');
    if(raw){const d=JSON.parse(raw);if(d&&d.users)DATA=d;}
  }catch(e){}
  render();
}

function getUser(id){return DATA.users.find(u=>u.id===id)}
function getProgress(uid,key){return((DATA.progress[uid]||{})[key])||null}
function setProgress(uid,key,val){
  if(!DATA.progress[uid])DATA.progress[uid]={};
  DATA.progress[uid][key]=val;
  localSave();
}
function getAchievements(uid){return DATA.achievements[uid]||[]}
function grantAchievement(uid,id){
  if(!DATA.achievements[uid])DATA.achievements[uid]=[];
  if(DATA.achievements[uid].includes(id))return false;
  DATA.achievements[uid].push(id);
  localSave();
  const a=ACHIEVEMENTS.find(x=>x.id===id);
  if(a)showToast(a.icon,a.name,a.desc);
  return true;
}
function getTTProgress(uid,t){return getProgress(uid,`tt_${t}`)||{best:0,done:false}}
function setTTProgress(uid,t,data){setProgress(uid,`tt_${t}`,data)}
function getLessonProgress(uid,lid){return getProgress(uid,`l_${lid}`)||null}
function setLessonProgress(uid,lid,score,total){
  setProgress(uid,`l_${lid}`,{score,total,pct:Math.round(score/total*100),done:score===total});
  if(score===total)grantAchievement(uid,'perfect_quiz');
  grantAchievement(uid,'first_quiz');
}

function go(view,params={}){
  S.view=view;S.params=params;
  window.scrollTo(0,0);
  render();
}

// ─── UTILS ────────────────────────────────────────────────────────
function el(id){return document.getElementById(id)}
function shuffle(arr){let a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function randInt(min,max){return Math.floor(Math.random()*(max-min+1))+min}
function pct(a,b){return b?Math.round(a/b*100):0}

function showToast(icon,title,sub){
  const old=document.querySelector('.toast');
  if(old)old.remove();
  const t=document.createElement('div');
  t.className='toast';
  t.innerHTML=`<div class="ti">${icon}</div><div><div class="tt-title">${title}</div><div class="tt-sub">${sub}</div></div>`;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),3500);
}

function starRating(pct){
  if(pct>=100)return '⭐⭐⭐';
  if(pct>=60)return '⭐⭐';
  if(pct>=1)return '⭐';
  return '☆☆☆';
}

// ─── RENDER: MAIN ─────────────────────────────────────────────────
function render(){
  const app=el('app');
  if(!app)return;
  if(!S.user){
    app.innerHTML=renderLogin();
    bindLogin();
    return;
  }
  const views={
    dashboard:renderDashboard,
    tt_hub:renderTTHub,
    tt_practice:renderTTPractice,
    tt_speed:renderTTSpeed,
    tt_battle:renderTTBattle,
    curriculum:renderCurriculum,
    year:renderYear,
    lesson:renderLesson,
    quiz:renderQuiz,
    chase:renderChase,
    chase_game:renderChaseGame,
    parent:renderParent,
    settings:renderSettings,
  };
  const viewFn=views[S.view]||renderDashboard;
  app.innerHTML=renderShell(viewFn());
  bindAll();
}

function renderShell(content){
  const u=S.user;
  const isParent=u.role==='parent';
  const navItems=isParent?[
    {id:'parent',icon:'📊',label:'Progress'},
    {id:'settings',icon:'⚙️',label:'Settings'},
  ]:[
    {id:'dashboard',icon:'🏠',label:'Home'},
    {id:'tt_hub',icon:'✖',label:'Tables'},
    {id:'curriculum',icon:'📚',label:'Learn'},
    {id:'chase',icon:'🧠',label:'CHASE'},
  ];
  // Smart back: each view maps to its parent view + the params to carry forward
  const backMap={
    tt_practice:  {view:'tt_hub',    params:{}},
    tt_speed:     {view:'tt_hub',    params:{}},
    tt_battle:    {view:'tt_hub',    params:{}},
    year:         {view:'curriculum',params:{}},
    lesson:       {view:'year',      params:{year:S.params.year}},
    quiz:         {view:'lesson',    params:{year:S.params.year,lid:S.params.lid}},
    chase_game:   {view:'chase',     params:{}},
    settings:     {view:'dashboard', params:{}},
  };
  const back=backMap[S.view];
  const showBack=!!back;
  const isActive=(id)=>S.view===id||(id==='dashboard'&&['dashboard'].includes(S.view));
  const avatarHtml=u.avatar&&u.avatar.startsWith('data:')
    ?`<img class="topbar-avatar-img" src="${u.avatar}" alt="${u.name}">`
    :`<span class="topbar-avatar">${u.avatar}</span>`;
  return `
    <div class="topbar">
      ${showBack?`<button class="topbar-back" onclick='go("${back.view}",${JSON.stringify(back.params)})'>‹ Back</button>`:''}
      <div class="topbar-logo">FONA <span>Maths</span></div>
      <div class="topbar-user">
        ${avatarHtml}
        <span class="topbar-name">${u.name.split(' ')[0]}</span>
        <button class="topbar-exit" onclick="logout()">Exit</button>
      </div>
    </div>
    <div class="page ${['parent','curriculum'].includes(S.view)?'wide':''}">
      ${content}
    </div>
    <nav class="bottom-nav">
      ${navItems.map(n=>`
        <button class="bnav-btn ${isActive(n.id)?'active':''}" onclick="go('${n.id}')">
          <span class="bicon">${n.icon}</span>
          <span class="blabel">${n.label}</span>
        </button>`).join('')}
      <button class="bnav-btn" onclick="logout()">
        <span class="bicon">🔓</span>
        <span class="blabel">Logout</span>
      </button>
    </nav>
  `;
}

    const inp=c.querySelector('input[type=password]');
    if(inp)inp.value='';
    const err=c.querySelector('.pin-error');
    if(err)err.textContent='';
  });
  const pc=el('pc_'+id);
  if(pc)pc.classList.add('active');
  const inp=el('pin_'+id);
  if(inp)setTimeout(()=>inp.focus(),50);
}

function doLogin(uid){
  const id=uid||loginSelected;
  if(!id)return;
  const inp=el('pin_'+id);
  const err=el('perr_'+id);
  const code=(inp?.value||'').trim().toUpperCase();
  if(!code){if(err)err.textContent='Please enter your code.';return;}
  const u=DATA.users.find(x=>x.id===id);
  if(u&&code===u.code.toUpperCase()){
    S.user=u;
    S.view=u.role==='parent'?'parent':'dashboard';
    render();
  } else {
    if(err)err.textContent='Incorrect code. Try again.';
    if(inp){inp.value='';inp.focus();}
  }
}

let ttPracticeState={table:2,idx:0,score:0,streak:0,total:12,done:false};

function renderTTPractice(){
  const t=S.params.table||2;
  ttPracticeState={table:t,idx:0,score:0,streak:0,total:12,done:false};
  const hook=TT_HOOKS[t]||'';
  return `

  <div id="tt-practice-area">${renderTTPracticeQ()}</div>
  `;

function renderTTPracticeQ(){
  const st=ttPracticeState;
  if(st.done){
    const p=pct(st.score,st.total);
    setTTProgress(S.user.id,st.table,{best:p,done:p>=80});
    if(p>=80)grantAchievement(S.user.id,'tt_all');
    return `<div class="result-box animate-pop">
      <div class="big-emoji">${p>=80?'🏆':p>=50?'👍':'💪'}</div>
      <h2>${p>=80?'Mastered!':p>=50?'Good Work!':'Keep Practising!'}</h2>
      <div class="result-score">${st.score}/${st.total}</div>
      <div class="stars-row">${starRating(p)}</div>
      <p class="muted">Score: ${p}%</p>
      <div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap">
        <button class="btn btn-gold" onclick="go('tt_practice',{table:${st.table}})">Try Again</button>
        <button class="btn btn-outline" onclick="go('tt_hub')">All Tables</button>
      </div>
    </div>`;
  }
  const n=st.idx+1;
  const question=`${n} × ${st.table}`;
  const correct=n*st.table;
  return `
  <div class="quiz-header">
    <span class="quiz-counter">Question ${st.idx+1} of ${st.total}</span>
    <span class="quiz-score-pill">Score: ${st.score}</span>
  </div>
  <div style="margin-bottom:10px"><div class="progress-bar"><div class="progress-fill" style="width:${pct(st.idx,st.total)}%"></div></div></div>
  <div class="quiz-question">
    <div class="qhook">${TT_HOOKS[st.table].replace('{n}',n)}</div>
    <div class="qtext">${question} = ?</div>
  </div>
  <div class="tt-input-box">
    <input type="number" class="tt-input" id="tt-ans" placeholder="?" min="0" max="999" autocomplete="off">
    <button class="btn btn-gold" onclick="checkTTAns(${correct})">Check ✓</button>
  </div>
  <div id="tt-feedback" style="text-align:center;font-size:1rem;min-height:28px"></div>
  `;
}

function checkTTAns(correct){
  const inp=el('tt-ans');
  const fb=el('tt-feedback');
  if(!inp)return;
  const val=parseInt(inp.value);
  if(isNaN(val)){inp.focus();return;}
  if(val===correct){
    inp.className='tt-input correct';
    if(fb)fb.innerHTML=`<span style="color:var(--green);font-weight:700">✓ Correct! ${correct} 🎉</span>`;
    ttPracticeState.score++;
    ttPracticeState.streak++;
    if(ttPracticeState.streak>=5)grantAchievement(S.user.id,'streak_5');
    if(ttPracticeState.streak>=10)grantAchievement(S.user.id,'streak_10');
  } else {
    inp.className='tt-input wrong';
    if(fb)fb.innerHTML=`<span style="color:var(--red);font-weight:700">✗ The answer was ${correct}</span>`;
    ttPracticeState.streak=0;
  }
  ttPracticeState.idx++;
  if(ttPracticeState.idx>=ttPracticeState.total)ttPracticeState.done=true;
  setTimeout(()=>{
    const area=el('tt-practice-area');
    if(area)area.innerHTML=renderTTPracticeQ();
    const ni=el('tt-ans');
    if(ni)ni.focus();
  },900);
}

function startSpeed(){
  S.speed.active=true;S.speed.score=0;S.speed.secs=60;

}

function nextSpeedQ(){
  const a=randInt(2,12),b=randInt(1,12),ans=a*b;
  S.speed.current={a,b,ans};
  const opts=shuffle([ans,...new Set([ans+randInt(1,4),ans-randInt(1,4),ans+randInt(5,12)])].slice(0,4));
  const area=el('speed-area');
  if(!area)return;
  area.innerHTML=`
  <div class="timer-ring">

function speedAns(chosen,correct){

}

function endSpeed(){

let bp1=null,bp2=null;
function setBattlePlayer(num,id){
  const u=getUser(id);
  if(num===1){bp1=u;const l=el('battle-p1-label');if(l)l.textContent=`Player 1: ${u.avatar} ${u.name} ✓`}
  else{bp2=u;const l=el('battle-p2-label');if(l)l.textContent=`Player 2: ${u.avatar} ${u.name} ✓`}
}

function startBattle(){
  if(!bp1||!bp2){showToast('⚠️','Select Players','Please choose both players first');return;}
  if(bp1.id===bp2.id){showToast('⚠️','Different Players','Please choose two different players');return;}
  S.battle={players:[bp1,bp2],scores:[0,0],active:true,round:0,turns:10,current:null,phase:'playing',currentPlayer:0};
  nextBattleQ();
}

function nextBattleQ(){
  const b=S.battle;
  if(b.round>=b.turns){endBattle();return;}
  const a=randInt(2,12),n=randInt(1,12),ans=a*n;
  b.current={a,n,ans};
  const cp=b.players[b.currentPlayer];
  const opts=shuffle([ans,...new Set([ans+randInt(1,5),ans-randInt(1,5),ans+randInt(6,14)])].slice(0,4));
  const area=el('app');
  if(!area)return;
  area.innerHTML=renderShell(`
  <div class="section-title">⚔️ Battle — Round ${b.round+1}/${b.turns}</div>
  <div class="battle-arena">
    ${b.players.map((p,i)=>`<div class="battle-player ${i===b.currentPlayer?'active':''}">
      <div class="bp-av">${p.avatar}</div>
      <div class="bp-name">${p.name}</div>
      <div class="bp-score">${b.scores[i]}</div>
    </div>`).join('')}
  </div>
  <div class="quiz-question">
    <div class="qhook">${cp.avatar} ${cp.name}'s turn — look away ${b.players[1-b.currentPlayer].name}! 👀</div>
    <div class="qtext">${a} × ${n} = ?</div>
  </div>
  <div class="answer-grid mt12">
    ${opts.map(o=>`<button class="ans-btn" onclick="battleAns(${o},${ans})">${o}</button>`).join('')}
  </div>
  <div style="text-align:center;margin-top:12px;color:var(--fg2);font-size:.82rem">Tap the correct answer!</div>
  `);
  bindAll();
}

function battleAns(chosen,correct){
  const b=S.battle;
  const cp=b.currentPlayer;
  const btns=document.querySelectorAll('.ans-btn');
  btns.forEach(btn=>{
    if(parseInt(btn.textContent)===correct)btn.classList.add('reveal');
    if(parseInt(btn.textContent)===chosen&&chosen!==correct)btn.classList.add('wrong');
    btn.disabled=true;
  });
  if(chosen===correct){
    b.scores[cp]++;
    showToast('✅','Correct!',`${b.players[cp].name} scores a point!`);
    if(b.players[cp].id===S.user?.id)grantAchievement(S.user.id,'battle_won');
  } else {
    showToast('❌','Wrong!',`The answer was ${correct}`);
  }
  b.round++;
  b.currentPlayer=1-b.currentPlayer;
  setTimeout(nextBattleQ,1200);
}

function endBattle(){
  S.battle.phase='done';
  render();
}

function renderQuiz(){
  const lid=S.params.lid;
  const l=findLesson(lid);
  if(!l)return`<p>Lesson not found</p>`;
  S.quiz={qs:l.qs,idx:0,score:0,streak:0,maxStreak:0,lid,selected:null,done:false};
  return renderQuizQ();
}

function renderQuizQ(){
  const q=S.quiz;
  if(q.done||q.idx>=q.qs.length){
    setLessonProgress(S.user.id,q.lid,q.score,q.qs.length);
    const p=pct(q.score,q.qs.length);
    return `
    <div class="quiz-wrap">
      <div class="result-box animate-pop">
        <div class="big-emoji">${p>=75?'🎉':p>=50?'👍':'💪'}</div>
        <h2>${p>=100?'Perfect!':p>=75?'Excellent!':p>=50?'Good Effort!':'Keep Going!'}</h2>
        <div class="result-score">${q.score}/${q.qs.length}</div>
        <div class="stars-row">${starRating(p)}</div>
        <div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;justify-content:center">
          <button class="btn btn-gold" onclick="go('quiz',{lid:'${q.lid}',year:${S.params.year}})">Retry</button>
          <button class="btn btn-outline" onclick="go('lesson',{year:${S.params.year},lid:'${q.lid}'})">Review Lesson</button>
          <button class="btn btn-outline" onclick="go('year',{year:${S.params.year}})">All Topics</button>
        </div>
      </div>
    </div>`;
  }
  const cur=q.qs[q.idx];
  const opts=cur.opts;
  return `
  <div class="quiz-wrap">
    <div class="quiz-header">
      <span class="quiz-counter">Question ${q.idx+1} of ${q.qs.length}</span>
      <span class="quiz-score-pill">${q.score} correct</span>
    </div>
    <div class="mb8"><div class="progress-bar"><div class="progress-fill" style="width:${pct(q.idx,q.qs.length)}%"></div></div></div>
    <div class="quiz-question">
      <div class="qtext">${cur.q}</div>
    </div>
    <div class="answer-grid mt16">
      ${opts.map(o=>`<button class="ans-btn" onclick="quizAns(this,'${escQ(String(o))}','${escQ(String(cur.a))}')">${o}</button>`).join('')}
    </div>
    <div id="quiz-feedback" style="text-align:center;min-height:24px;margin-top:8px;font-size:.9rem"></div>
    <button class="btn btn-gold btn-block mt12" id="next-btn" style="display:none" onclick="quizNext()">Next Question →</button>
  </div>`;
}

function escQ(s){return s.replace(/'/g,"\\'").replace(/"/g,'&quot;')}

function quizAns(btn,chosen,correct){
  const btns=document.querySelectorAll('.ans-btn');
  btns.forEach(b=>b.disabled=true);
  const fb=el('quiz-feedback');
  const nb=el('next-btn');
  btns.forEach(b=>{
    if(b.textContent.trim()===correct)b.classList.add('reveal');
  });
  if(chosen===correct){
    btn.classList.add('correct');
    S.quiz.score++;
    S.quiz.streak++;
    S.quiz.maxStreak=Math.max(S.quiz.streak,S.quiz.maxStreak);
    if(S.quiz.streak>=5)grantAchievement(S.user.id,'streak_5');
    if(S.quiz.streak>=10)grantAchievement(S.user.id,'streak_10');
    if(fb)fb.innerHTML=`<span style="color:var(--green);font-weight:700">✓ Correct! 🎉</span>`;
  } else {
    btn.classList.add('wrong');
    S.quiz.streak=0;
    if(fb)fb.innerHTML=`<span style="color:var(--red);font-weight:700">✗ The answer was ${correct}</span>`;
  }
  if(nb)nb.style.display='flex';
}

function quizNext(){
  S.quiz.idx++;
  const area=document.querySelector('.quiz-wrap');
  if(area)area.innerHTML=(S.quiz.idx>=S.quiz.qs.length)?renderQuizQ().replace('<div class="quiz-wrap">','').replace(/<\/div>$/,''):renderQuizQ().replace('<div class="quiz-wrap">','').replace(/<\/div>$/,'');
  // simpler: re-render the whole page
  const app=el('app');
  if(app)app.innerHTML=renderShell(renderQuizQ());
  bindAll();
}

// ─── VIEW: PARENT DASHBOARD ───────────────────────────────────────
function makeTTBarChart(uid,accentColor){
  const tables=Array.from({length:11},(_,i)=>i+2);
  const vals=tables.map(t=>getTTProgress(uid,t).best||0);
  const W=320,H=90,barW=20,gap=6,x0=0;
  const bars=tables.map((t,i)=>{
    const v=vals[i];
    const bh=Math.max(2,Math.round((v/100)*H));
    const x=i*(barW+gap);
    const done=getTTProgress(uid,t).done;
    const fill=done?'#2ECC8A':v>0?accentColor:'rgba(255,255,255,.08)';
    return `<g>
      <rect x="${x}" y="${H-bh}" width="${barW}" height="${bh}" rx="4" fill="${fill}" opacity=".9"/>
      <text x="${x+barW/2}" y="${H+13}" text-anchor="middle" font-size="9" fill="rgba(255,255,255,.45)" font-family="Space Grotesk,sans-serif">×${t}</text>
      ${v>0?`<text x="${x+barW/2}" y="${H-bh-4}" text-anchor="middle" font-size="8" fill="${fill}" font-family="Space Grotesk,sans-serif">${v}%</text>`:''}
    </g>`;
  }).join('');
  const totalW=(barW+gap)*11-gap;
  return `<svg viewBox="0 0 ${totalW} ${H+20}" style="width:100%;max-width:${totalW}px;overflow:visible">${bars}</svg>`;
}

function makeRingChart(pct,color,size=80){
  const r=32,cx=40,cy=40,circ=2*Math.PI*r;
  const dash=circ*(pct/100);
  return `<svg width="${size}" height="${size}" viewBox="0 0 80 80">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="8"/>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="8"
      stroke-dasharray="${dash} ${circ}" stroke-dashoffset="${circ/4}"
      stroke-linecap="round" style="transition:stroke-dasharray .8s ease"/>
    <text x="${cx}" y="${cy+5}" text-anchor="middle" font-size="13" font-weight="800"
      fill="${color}" font-family="Nunito,sans-serif">${pct}%</text>
  </svg>`;
}

function saveProfile(uid){
  const u=DATA.users.find(x=>x.id===uid);
  if(!u)return;
  const n=el('set_name_'+uid);
  const c=el('set_code_'+uid);
  const y=el('set_year_'+uid);
  if(n)u.name=n.value.trim()||u.name;
  if(c&&c.value.trim())u.code=c.value.trim().toUpperCase();
  if(y)u.year=parseInt(y.value)||u.year;
  if(S.user&&S.user.id===uid)S.user=u;
  localSave();
  if(sb)sb.from('fona_profiles').upsert({id:u.id,name:u.name,avatar:u.avatar,year_group:u.year,role:u.role,code:u.code,color:u.color}).then(({error})=>{if(error)console.warn('profile save:',error);});
  const ind=el('set_saved_'+uid);
  if(ind){ind.textContent='✓ Saved!';setTimeout(()=>ind.textContent='',2000);}
}

  DATA.achievements[uid]=[];
  localSave();
  if(sb){
    sb.from('fona_progress').delete().eq('profile_id',uid).then(({error})=>{if(error)console.warn('reset progress:',error);});
    sb.from('fona_achievements').delete().eq('profile_id',uid).then(({error})=>{if(error)console.warn('reset achievements:',error);});
  }
  showToast('🔄','Progress Reset','All progress cleared for this profile');
  render();
}

// ─── BIND EVENTS ─────────────────────────────────────────────────
function bindAll(){
  // pin-input no longer used (inline per-card inputs handle Enter in bindLogin)
  // TT answer enter key
  const ta=el('tt-ans');
  if(ta)ta.addEventListener('keydown',e=>{
    if(e.key==='Enter'){
      const cb=ta.closest('.page')?.querySelector('.btn-gold');
      if(cb)cb.click();
    }
  });
}

// ─── INIT ─────────────────────────────────────────────────────────
// Primary boot — fires when DOM is ready
if(document.readyState==='loading'){
  window.addEventListener('DOMContentLoaded',()=>initData());
} else {
  // DOM already parsed (script is at bottom of body) — boot immediately
  initData();
}

// Expose global functions needed by onclick handlers
Object.assign(window,{
  go,logout,render,initData,
  selectProfile,doLogin,clearLoginErr,
  checkTTAns,startSpeed,speedAns,
  startBattle,setBattlePlayer,battleAns,
  quizAns,quizNext,
  chaseAns,chaseNext,
  saveProfile,resetProgress,
  nextSpeedQ,endSpeed,endBattle,
});
</script>
